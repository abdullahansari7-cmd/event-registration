services:

  app:
    image: saniansari/event-registration:latest
    container_name: event-registration-app
    ports:
      - "5001:5000"

  prometheus:
    image: prom/prometheus:latest
    container_name: event-registration-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: event-registration-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus